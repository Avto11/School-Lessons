<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ცხრილი</title>

    <!-- Google Font matching the clean Georgian rounded style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700;800&display=swap" rel="stylesheet">

    <!-- PWA & Mobile Settings -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- iOS / Safari PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ცხრილი">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Dynamic Manifest Injection -->
    <script>
        (function() {
            const baseUrl = window.location.href.split('?')[0];
            const iconUrl = new URL("icon.png", baseUrl).href;
            
            const manifest = {
                "name": "ცხრილი",
                "short_name": "ცხრილი",
                "start_url": baseUrl,
                "display": "standalone",
                "background_color": "#0a0a0a",
                "theme_color": "#0a0a0a",
                "icons": [
                    {
                        "src": iconUrl,
                        "sizes": "192x192",
                        "type": "image/png",
                        "purpose": "any maskable"
                    },
                    {
                        "src": iconUrl,
                        "sizes": "512x512",
                        "type": "image/png",
                        "purpose": "any maskable"
                    }
                ]
            };
            
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Noto Sans Georgian', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            color: #000000;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0a0a0a;
                color: #ffffff;
            }
        }

        #schedule-container {
            text-align: center;
            width: 100%;
            max-width: 480px;
            padding: 2rem 1rem 5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Clickable Title with Underline */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 2rem;
            line-height: 1.1;
            letter-spacing: -0.01em;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 6px;
            text-decoration-thickness: 2px;
            user-select: none;
        }

        #subjects-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            width: 100%;
        }

        /* Subject row with smooth fade in/out time labels */
        .subject-row {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.25rem;
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: -0.01em;
            cursor: pointer;
            user-select: none;
            width: 100%;
        }

        .time-label {
            font-size: 1.25rem;
            font-style: italic;
            opacity: 0;
            width: 75px;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
            flex-shrink: 0;
        }

        .time-label.start {
            text-align: right;
            padding-right: 12px;
            transform: translateX(8px);
        }

        .time-label.end {
            text-align: left;
            padding-left: 12px;
            transform: translateX(-8px);
        }

        .subject-row.active-time .time-label {
            opacity: 0.65;
            transform: translateX(0);
        }

        .subject-name {
            text-align: center;
        }

        #monday-label {
            font-size: 1.25rem;
            font-style: italic;
            margin-top: 2rem;
            display: none;
            opacity: 0.75;
        }

        /* Bottom Day Picker Switcher with Smooth Fade In/Out */
        #day-picker {
            position: fixed;
            bottom: 38px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            display: flex;
            gap: 6px;
            background-color: rgba(0, 0, 0, 0.06);
            padding: 4px;
            border-radius: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: 10;
        }

        #day-picker.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .day-btn {
            position: relative;
            background: none;
            border: none;
            color: inherit;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 12px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s, background-color 0.2s;
        }

        /* Highlight currently viewing day */
        .day-btn.active {
            opacity: 1;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        /* Highlight actual current real-world day */
        .day-btn.is-today::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background-color: currentColor;
            border-radius: 50%;
            opacity: 0.8;
        }

        @media (prefers-color-scheme: dark) {
            #day-picker {
                background-color: rgba(255, 255, 255, 0.1);
            }
            .day-btn.active {
                background-color: #222222;
                box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            }
        }

        /* Bottom Segmented Progress Bar */
        #progress-bar-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 400px;
            display: flex;
            gap: 6px;
            height: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        #progress-bar-container.visible {
            opacity: 1;
        }

        .bar-segment {
            flex: 1;
            background-color: rgba(127, 127, 127, 0.2);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background-color: rgba(127, 127, 127, 0.8);
            border-radius: 2px;
            transition: width 0.5s linear;
        }

        @media (prefers-color-scheme: dark) {
            .bar-segment {
                background-color: rgba(255, 255, 255, 0.15);
            }
            .bar-fill {
                background-color: rgba(255, 255, 255, 0.75);
            }
        }
    </style>
</head>
<body>

    <div id="schedule-container">
        <h1 id="day-title" onclick="toggleDayPicker()"></h1>
        <div id="subjects-list"></div>
        <div id="monday-label">*ორშაბათის ცხრილი</div>
    </div>

    <!-- Day Picker Switcher (Mon-Fri only) -->
    <div id="day-picker">
        <button class="day-btn" onclick="selectDay(1)">ორ</button>
        <button class="day-btn" onclick="selectDay(2)">სა</button>
        <button class="day-btn" onclick="selectDay(3)">ოთ</button>
        <button class="day-btn" onclick="selectDay(4)">ხუ</button>
        <button class="day-btn" onclick="selectDay(5)">პა</button>
    </div>

    <!-- Segmented Progress Bar -->
    <div id="progress-bar-container">
        <div class="bar-segment"><div class="bar-fill" id="fill-0"></div></div>
        <div class="bar-segment"><div class="bar-fill" id="fill-1"></div></div>
        <div class="bar-segment"><div class="bar-fill" id="fill-2"></div></div>
        <div class="bar-segment"><div class="bar-fill" id="fill-3"></div></div>
        <div class="bar-segment"><div class="bar-fill" id="fill-4"></div></div>
        <div class="bar-segment"><div class="bar-fill" id="fill-5"></div></div>
        <div class="bar-segment"><div class="bar-fill" id="fill-6"></div></div>
    </div>

    <script>
        const schedules = {
            1: {
                dayName: "ორშაბათი",
                subjects: ["მათემატიკა", "მათემატიკა", "ფიზიკა", "მუსიკა", "ქართული", "გერმანული", "ინგლისური"]
            },
            2: {
                dayName: "სამშაბათი",
                subjects: ["მათემატიკა", "მათემატიკა", "ფიზიკა", "ქართული", "ქიმია", "ბიოლოგია", "ინგლისური"]
            },
            3: {
                dayName: "ოთხშაბათი",
                subjects: ["ფიზიკა", "ისტორია", "მათემატიკა", "მათემატიკა", "ქართული", "ბიოლოგია", "სპორტი"]
            },
            4: {
                dayName: "ხუთშაბათი",
                subjects: ["გეოგრაფია", "ქართული", "ფიზიკა", "მათემატიკა", "მოქალაქეობა", "ქიმია", "ინგლისური"]
            },
            5: {
                dayName: "პარასკევი",
                subjects: ["ფიზიკა", "ქართული", "მათემატიკა", "მათემატიკა", "ისტორია", "ასტრონომია", "გერმანული"]
            },
            6: {
                dayName: "შაბათი*",
                subjects: ["მათემატიკა", "მათემატიკა", "ფიზიკა", "მუსიკა", "ქართული", "გერმანული", "ინგლისური"]
            },
            0: {
                dayName: "კვირა*",
                subjects: ["მათემატიკა", "მათემატიკა", "ფიზიკა", "მუსიკა", "ქართული", "გერმანული", "ინგლისური"]
            }
        };

        const lessonTimes = [
            { start: "08:30", end: "09:10", startMin: 8 * 60 + 30, endMin: 9 * 60 + 10 },
            { start: "09:15", end: "09:55", startMin: 9 * 60 + 15, endMin: 9 * 60 + 55 },
            { start: "10:00", end: "10:40", startMin: 10 * 60 + 0,  endMin: 10 * 60 + 40 },
            { start: "10:50", end: "11:30", startMin: 10 * 60 + 50, endMin: 11 * 60 + 30 },
            { start: "11:35", end: "12:15", startMin: 11 * 60 + 35, endMin: 12 * 60 + 15 },
            { start: "12:20", end: "13:00", startMin: 12 * 60 + 20, endMin: 13 * 60 + 0 },
            { start: "13:05", end: "13:45", startMin: 13 * 60 + 5,  endMin: 13 * 60 + 45 }
        ];

        let selectedDayIndex = null;
        let timeLabelTimer = null;
        let dayPickerTimer = null;

        function getAutoDayIndex() {
            const now = new Date();
            let currentHour = now.getHours();
            let currentDay = now.getDay();
            if (currentHour >= 14) {
                currentDay = (currentDay + 1) % 7;
            }
            return currentDay;
        }

        function hideDayPicker() {
            const picker = document.getElementById('day-picker');
            picker.classList.remove('visible');
            if (dayPickerTimer) {
                clearTimeout(dayPickerTimer);
                dayPickerTimer = null;
            }
        }

        function toggleDayPicker() {
            const picker = document.getElementById('day-picker');
            const isVisible = picker.classList.contains('visible');

            if (isVisible) {
                hideDayPicker();
            } else {
                picker.classList.add('visible');
                resetDayPickerTimer();
            }
        }

        function resetDayPickerTimer() {
            if (dayPickerTimer) clearTimeout(dayPickerTimer);
            dayPickerTimer = setTimeout(() => {
                hideDayPicker();
            }, 5000);
        }

        function selectDay(dayIdx) {
            selectedDayIndex = dayIdx;
            updateSchedule();
            resetDayPickerTimer();
        }

        function showSubjectTime(element) {
            if (timeLabelTimer) clearTimeout(timeLabelTimer);

            const allRows = document.querySelectorAll('.subject-row');
            allRows.forEach(row => row.classList.remove('active-time'));

            element.classList.add('active-time');

            timeLabelTimer = setTimeout(() => {
                element.classList.remove('active-time');
            }, 5000);
        }

        function updateProgressBar(now) {
            const autoDay = getAutoDayIndex();
            const viewingDay = selectedDayIndex !== null ? selectedDayIndex : autoDay;
            const currentDay = now.getDay();
            const isWeekday = currentDay >= 1 && currentDay <= 5;
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            const schoolStart = 8 * 60 + 30;
            const schoolEnd = 13 * 60 + 45;

            const progressBarContainer = document.getElementById('progress-bar-container');

            if (viewingDay === currentDay && isWeekday && currentMinutes >= schoolStart && currentMinutes <= schoolEnd) {
                progressBarContainer.classList.add('visible');

                lessonTimes.forEach((lesson, index) => {
                    const fillElement = document.getElementById(`fill-${index}`);
                    
                    if (currentMinutes >= lesson.endMin) {
                        fillElement.style.width = '100%';
                    } else if (currentMinutes < lesson.startMin) {
                        fillElement.style.width = '0%';
                    } else {
                        const lessonDuration = lesson.endMin - lesson.startMin;
                        const elapsed = currentMinutes - lesson.startMin;
                        const percentage = Math.min(100, Math.max(0, (elapsed / lessonDuration) * 100));
                        fillElement.style.width = `${percentage}%`;
                    }
                });
            } else {
                progressBarContainer.classList.remove('visible');
            }
        }

        function updateSchedule() {
            const now = new Date();
            const activeDayIdx = selectedDayIndex !== null ? selectedDayIndex : getAutoDayIndex();
            const targetSchedule = schedules[activeDayIdx];
            const realTodayDay = now.getDay();

            document.getElementById('day-title').textContent = targetSchedule.dayName;

            const subjectsContainer = document.getElementById('subjects-list');
            subjectsContainer.innerHTML = '';

            targetSchedule.subjects.forEach((subject, idx) => {
                const row = document.createElement('div');
                row.className = 'subject-row';
                row.onclick = () => showSubjectTime(row);

                const time = lessonTimes[idx] || { start: '', end: '' };

                row.innerHTML = `
                    <span class="time-label start">${time.start}</span>
                    <span class="subject-name">${subject}</span>
                    <span class="time-label end">${time.end}</span>
                `;
                subjectsContainer.appendChild(row);
            });

            const mondayLabel = document.getElementById('monday-label');
            mondayLabel.style.display = (activeDayIdx === 0 || activeDayIdx === 6) ? 'block' : 'none';

            // Highlight Active View & Today Indicator in Day Picker (Mon=1 ... Fri=5)
            const buttons = document.querySelectorAll('.day-btn');
            const dayValues = [1, 2, 3, 4, 5];

            buttons.forEach((btn, idx) => {
                const dayVal = dayValues[idx];
                
                // Highlight viewed day
                if (dayVal === activeDayIdx) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }

                // Highlight real-world current day
                if (dayVal === realTodayDay) {
                    btn.classList.add('is-today');
                } else {
                    btn.classList.remove('is-today');
                }
            });

            updateProgressBar(now);
        }

        updateSchedule();
        setInterval(updateSchedule, 10000);

        // Auto-Update Engine
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    // Check for updates on load
                    reg.update();

                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        if (newWorker) {
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        }
                    });
                });

                // Force update check when returning to app
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') {
                        navigator.serviceWorker.ready.then(reg => reg.update());
                    }
                });

                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        refreshing = true;
                        window.location.reload();
                    }
                });
            });
        }
    </script>
</body>
</html>
