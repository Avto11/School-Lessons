<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ცხრილი</title>

    <!-- Google Font matching the clean Georgian rounded style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700;800&display=swap" rel="stylesheet">

    <!-- PWA & Mobile Settings -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- iOS / Safari PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ცხრილი">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Dynamic Manifest Injection -->
    <script>
        (function() {
            const baseUrl = window.location.href.split('?')[0];
            const iconUrl = new URL("icon.png", baseUrl).href;
            
            const manifest = {
                "name": "ცხრილი",
                "short_name": "ცხრილი",
                "start_url": baseUrl,
                "display": "standalone",
                "background_color": "#0a0a0a",
                "theme_color": "#0a0a0a",
                "icons": [
                    {
                        "src": iconUrl,
                        "sizes": "192x192",
                        "type": "image/png",
                        "purpose": "any maskable"
                    },
                    {
                        "src": iconUrl,
                        "sizes": "512x512",
                        "type": "image/png",
                        "purpose": "any maskable"
                    }
                ]
            };
            
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        html, body {
            height: 100%;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Noto Sans Georgian', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            color: #000000;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0a0a0a;
                color: #ffffff;
            }
        }

        #schedule-container {
            text-align: center;
            width: 100%;
            max-width: 480px;
            padding: 2rem 1rem 4rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 2rem;
            line-height: 1.1;
            letter-spacing: -0.01em;
        }

        #subjects-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            width: 100%;
        }

        .subject {
            font-size: 2.25rem;
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: -0.01em;
        }

        #monday-label {
            font-size: 1.25rem;
            font-style: italic;
            margin-top: 2rem;
            display: none;
            opacity: 0.75;
        }

        /* Subtle Bottom Segmented Progress Bar */
        #progress-bar-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 400px;
            display: flex;
            gap: 6px;
            height: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        #progress-bar-container.visible {
            opacity: 1;
        }

        .bar-segment {
            flex: 1;
            background-color: rgba(127, 127, 127, 0.2);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background-color: rgba(127, 127, 127, 0.8);
            border-radius: 2px;
            transition: width 0.5s linear;
        }

        @media (prefers-color-scheme: dark) {
            .bar-segment {
                background-color: rgba(255, 255, 255, 0.15);
            }
            .bar-fill {
                background-color: rgba(255, 255, 255, 0.75);
            }
        }
    </style>
</head>
<body>

    <div id="schedule-container">
        <h1 id="day-title"></h1>
        <div id="subjects-list"></div>
        <div id="monday-label">*ორშაბათის ცხრილი</div>
    </div>

    <!-- Segmented Progress Bar -->
    <div id="progress-bar-container">
        <div class="bar-segment"><div class="bar-fill" id="fill-0"></div></div>
        <div class="bar-segment"><div class="bar-fill" id="fill-1"></div></div>
        <div class="bar-segment"><div class="bar-fill" id="fill-2"></div></div>
        <div class="bar-segment"><div class="bar-fill" id="fill-3"></div></div>
        <div class="bar-segment"><div class="bar-fill" id="fill-4"></div></div>
        <div class="bar-segment"><div class="bar-fill" id="fill-5"></div></div>
        <div class="bar-segment"><div class="bar-fill" id="fill-6"></div></div>
    </div>

    <script>
        const schedules = {
            1: { // Monday
                dayName: "ორშაბათი",
                subjects: [
                    "მათემატიკა",
                    "მათემატიკა",
                    "ფიზიკა",
                    "მუსიკა",
                    "ქართული",
                    "გერმანული",
                    "ინგლისური"
                ]
            },
            2: { // Tuesday
                dayName: "სამშაბათი",
                subjects: [
                    "მათემატიკა",
                    "მათემატიკა",
                    "ფიზიკა",
                    "ქართული",
                    "ქიმია",
                    "ბიოლოგია",
                    "ინგლისური"
                ]
            },
            3: { // Wednesday
                dayName: "ოთხშაბათი",
                subjects: [
                    "ფიზიკა",
                    "ისტორია",
                    "მათემატიკა",
                    "მათემატიკა",
                    "ქართული",
                    "ბიოლოგია",
                    "სპორტი"
                ]
            },
            4: { // Thursday
                dayName: "ხუთშაბათი",
                subjects: [
                    "გეოგრაფია",
                    "ქართული",
                    "ფიზიკა",
                    "მათემატიკა",
                    "მოქალაქეობა",
                    "ქიმია",
                    "ინგლისური"
                ]
            },
            5: { // Friday
                dayName: "პარასკევი",
                subjects: [
                    "ფიზიკა",
                    "ქართული",
                    "მათემატიკა",
                    "მათემატიკა",
                    "ისტორია",
                    "ასტრონომია",
                    "გერმანული"
                ]
            },
            6: { // Saturday -> Displays Monday schedule
                dayName: "შაბათი*",
                subjects: [
                    "მათემატიკა",
                    "მათემატიკა",
                    "ფიზიკა",
                    "მუსიკა",
                    "ქართული",
                    "გერმანული",
                    "ინგლისური"
                ]
            },
            0: { // Sunday -> Displays Monday schedule
                dayName: "კვირა*",
                subjects: [
                    "მათემატიკა",
                    "მათემატიკა",
                    "ფიზიკა",
                    "მუსიკა",
                    "ქართული",
                    "გერმანული",
                    "ინგლისური"
                ]
            }
        };

        // Lesson start/end times in minutes from midnight
        const lessonTimes = [
            { start: 8 * 60 + 30, end: 9 * 60 + 10 },  // 8:30 - 9:10
            { start: 9 * 60 + 15, end: 9 * 60 + 55 },  // 9:15 - 9:55
            { start: 10 * 60 + 0,  end: 10 * 60 + 40 }, // 10:00 - 10:40
            { start: 10 * 60 + 50, end: 11 * 60 + 30 }, // 10:50 - 11:30
            { start: 11 * 60 + 35, end: 12 * 60 + 15 }, // 11:35 - 12:15
            { start: 12 * 60 + 20, end: 13 * 60 + 0 },  // 12:20 - 13:00
            { start: 13 * 60 + 5,  end: 13 * 60 + 45 }  // 13:05 - 13:45
        ];

        function updateProgressBar(now) {
            const currentDay = now.getDay();
            const isWeekday = currentDay >= 1 && currentDay <= 5;
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            const schoolStart = 8 * 60 + 30; // 8:30 AM
            const schoolEnd = 13 * 60 + 45;  // 1:45 PM

            const progressBarContainer = document.getElementById('progress-bar-container');

            if (isWeekday && currentMinutes >= schoolStart && currentMinutes <= schoolEnd) {
                progressBarContainer.classList.add('visible');

                lessonTimes.forEach((lesson, index) => {
                    const fillElement = document.getElementById(`fill-${index}`);
                    
                    if (currentMinutes >= lesson.end) {
                        fillElement.style.width = '100%';
                    } else if (currentMinutes < lesson.start) {
                        fillElement.style.width = '0%';
                    } else {
                        const lessonDuration = lesson.end - lesson.start;
                        const elapsed = currentMinutes - lesson.start;
                        const percentage = Math.min(100, Math.max(0, (elapsed / lessonDuration) * 100));
                        fillElement.style.width = `${percentage}%`;
                    }
                });
            } else {
                progressBarContainer.classList.remove('visible');
            }
        }

        function updateSchedule() {
            const now = new Date();
            let currentHour = now.getHours();
            let currentDay = now.getDay();

            if (currentHour >= 14) {
                currentDay = (currentDay + 1) % 7;
            }

            const targetSchedule = schedules[currentDay];

            document.getElementById('day-title').textContent = targetSchedule.dayName;

            const subjectsContainer = document.getElementById('subjects-list');
            subjectsContainer.innerHTML = '';

            targetSchedule.subjects.forEach(subject => {
                const div = document.createElement('div');
                div.className = 'subject';
                div.textContent = subject;
                subjectsContainer.appendChild(div);
            });

            const mondayLabel = document.getElementById('monday-label');
            if (currentDay === 0 || currentDay === 6) {
                mondayLabel.style.display = 'block';
            } else {
                mondayLabel.style.display = 'none';
            }

            updateProgressBar(now);
        }

        updateSchedule();
        setInterval(updateSchedule, 10000);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered successfully', reg))
                    .catch(err => console.error('SW registration failed', err));
            });
        }
    </script>
</body>
</html>
