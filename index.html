<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ცხრილი</title>

    <!-- Google Font matching the clean Georgian rounded style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700;800&display=swap" rel="stylesheet">

    <!-- PWA & Mobile Settings -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- iOS / Safari PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ცხრილი">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Dynamically Inject Valid Manifest with Absolute URLs to pass PWA criteria -->
    <script>
        (function() {
            const baseUrl = window.location.href.split('?')[0];
            const iconUrl = new URL("icon.png", baseUrl).href;
            
            const manifest = {
                "name": "ცხრილი",
                "short_name": "ცხრილი",
                "start_url": baseUrl,
                "display": "standalone",
                "background_color": "#0a0a0a",
                "theme_color": "#0a0a0a",
                "icons": [
                    {
                        "src": iconUrl,
                        "sizes": "192x192",
                        "type": "image/png",
                        "purpose": "any"
                    },
                    {
                        "src": iconUrl,
                        "sizes": "512x512",
                        "type": "image/png",
                        "purpose": "maskable"
                    }
                ]
            };
            
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        html, body {
            height: 100%;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Lock scrolling */
        }

        body {
            font-family: 'Noto Sans Georgian', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            color: #000000;
        }

        /* Dark mode colors */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0a0a0a;
                color: #ffffff;
            }
        }

        #schedule-container {
            text-align: center;
            width: 100%;
            max-width: 480px;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 2rem;
            line-height: 1.1;
            letter-spacing: -0.01em;
        }

        #subjects-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            width: 100%;
        }

        .subject {
            font-size: 2.25rem;
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: -0.01em;
        }

        #monday-label {
            font-size: 1.25rem;
            font-style: italic;
            margin-top: 2rem;
            display: none;
            opacity: 0.75;
        }
    </style>
</head>
<body>

    <div id="schedule-container">
        <h1 id="day-title"></h1>
        <div id="subjects-list"></div>
        <div id="monday-label">*ორშაბათის ცხრილი</div>
    </div>

    <script>
        const schedules = {
            1: { // Monday
                dayName: "ორშაბათი",
                subjects: [
                    "მათემატიკა",
                    "მათემატიკა",
                    "ფიზიკა",
                    "მუსიკა",
                    "ქართული",
                    "გერმანული",
                    "ინგლისური"
                ]
            },
            2: { // Tuesday
                dayName: "სამშაბათი",
                subjects: [
                    "მათემატიკა",
                    "მათემატიკა",
                    "ფიზიკა",
                    "ქიმია",
                    "ბიოლოგია",
                    "ქართული",
                    "ინგლისური"
                ]
            },
            3: { // Wednesday
                dayName: "ოთხშაბათი",
                subjects: [
                    "ფიზიკა",
                    "ასტრონომია",
                    "მათემატიკა",
                    "მათემატიკა",
                    "ქართული",
                    "ბიოლოგია",
                    "სპორტი"
                ]
            },
            4: { // Thursday
                dayName: "ხუთშაბათი",
                subjects: [
                    "გეოგრაფია",
                    "ისტორია",
                    "ფიზიკა",
                    "ქართული",
                    "მათემატიკა",
                    "ქიმია",
                    "ინგლისური"
                ]
            },
            5: { // Friday
                dayName: "პარასკევი",
                subjects: [
                    "მოქალაქეობა",
                    "ქართული",
                    "ფიზიკა",
                    "მათემატიკა",
                    "მათემატიკა",
                    "ისტორია",
                    "გერმანული"
                ]
            },
            6: { // Saturday -> Displays Monday schedule
                dayName: "შაბათი*",
                subjects: [
                    "მათემატიკა",
                    "მათემატიკა",
                    "ფიზიკა",
                    "მუსიკა",
                    "ქართული",
                    "გერმანული",
                    "ინგლისური"
                ]
            },
            0: { // Sunday -> Displays Monday schedule
                dayName: "კვირა*",
                subjects: [
                    "მათემატიკა",
                    "მათემატიკა",
                    "ფიზიკა",
                    "მუსიკა",
                    "ქართული",
                    "გერმანული",
                    "ინგლისური"
                ]
            }
        };

        function updateSchedule() {
            const now = new Date();
            let currentHour = now.getHours();
            let currentDay = now.getDay();

            if (currentHour >= 14) {
                currentDay = (currentDay + 1) % 7;
            }

            const targetSchedule = schedules[currentDay];

            document.getElementById('day-title').textContent = targetSchedule.dayName;

            const subjectsContainer = document.getElementById('subjects-list');
            subjectsContainer.innerHTML = '';

            targetSchedule.subjects.forEach(subject => {
                const div = document.createElement('div');
                div.className = 'subject';
                div.textContent = subject;
                subjectsContainer.appendChild(div);
            });

            const mondayLabel = document.getElementById('monday-label');
            if (currentDay === 0 || currentDay === 6) {
                mondayLabel.style.display = 'block';
            } else {
                mondayLabel.style.display = 'none';
            }
        }

        updateSchedule();
        setInterval(updateSchedule, 60000);
    </script>
</body>
</html>
